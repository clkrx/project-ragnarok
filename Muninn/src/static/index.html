<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huginn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --bg-elevated: #141417;
    --bg-input: #16161a;
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.12);
    --text: #e8e8ec;
    --text-dim: #8a8a93;
    --text-faint: #5a5a63;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .logo-text {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  .logo-sub {
    color: var(--text-faint);
    font-size: 13px;
    font-weight: 400;
    margin-left: 4px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--bg-elevated);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    scroll-behavior: smooth;
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
  main::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.16); }

  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    gap: 12px;
  }

  .empty-title {
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .empty-sub {
    font-size: 14px;
  }

  .msg {
    margin-bottom: 16px;
    padding: 14px 18px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    animation: slideIn 0.25s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-role {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    color: var(--text-faint);
  }

  .msg-content {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg-content code {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .msg-error {
    color: var(--text-dim);
    font-style: italic;
    border-left: 2px solid var(--border-hover);
    padding-left: 12px;
  }

  footer {
    padding: 16px 24px 24px;
  }

  .input-wrap {
    position: relative;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: border-color 0.15s ease;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 4px;
  }

  .input-wrap:focus-within {
    border-color: var(--border-hover);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 18px;
    resize: none;
    outline: none;
    max-height: 200px;
    line-height: 1.5;
  }

  #input::placeholder { color: var(--text-faint); }

  .send-btn {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    margin: 4px;
    flex-shrink: 0;
  }

  .send-btn:hover { background: #ffffff; }
  .send-btn:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    cursor: not-allowed;
  }

  .send-btn svg { width: 16px; height: 16px; }

  .hint {
    margin-top: 8px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
  }

  kbd {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .tool-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 10px 0;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .tool-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border);
  }

  .tool-icon { color: var(--text-dim); }
  .tool-name { color: var(--text); font-weight: 500; }
  .tool-status {
    color: var(--text-faint);
    font-size: 12px;
    margin-left: auto;
  }

  .tool-input, .tool-output {
    padding: 10px 12px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text-dim);
  }

  .tool-output {
    border-top: 1px solid var(--border);
    color: var(--text);
    max-height: 300px;
    overflow-y: auto;
  }

  .msg-content h1, .msg-content h2, .msg-content h3 {
    margin: 16px 0 8px 0;
    font-weight: 600;
    color: var(--text);
  }

  .msg-content h1 { font-size: 20px; }
  .msg-content h2 { font-size: 17px; }
  .msg-content h3 { font-size: 15px; color: var(--text-dim); }

  .msg-content p { margin: 8px 0; }
  .msg-content p:first-child { margin-top: 0; }
  .msg-content p:last-child { margin-bottom: 0; }

  .msg-content ul, .msg-content ol {
    margin: 8px 0;
    padding-left: 24px;
  }

  .msg-content li { margin: 4px 0; }

  .msg-content strong { color: var(--text); font-weight: 600; }
  .msg-content em { color: var(--text-dim); }

  .msg-content pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    overflow-x: auto;
    margin: 12px 0;
  }

  .msg-content pre code {
    background: transparent;
    border: none;
    padding: 0;
    font-size: 13px;
  }

  .msg-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .msg-content a {
    color: var(--text);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--border-hover);
  }

  .msg-content a:hover { text-decoration-color: var(--text-dim); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-text">Huginn<span class="logo-sub">/ Project Ragnarok</span></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="reset()">New chat</button>
    </div>
  </header>

  <main id="messages">
    <div class="empty" id="empty">
      <div class="empty-title">Huginn is ready</div>
      <div class="empty-sub">Send a message to begin</div>
    </div>
  </main>

  <footer>
    <div class="input-wrap">
      <textarea id="input" placeholder="Message Huginn..." rows="1" autofocus></textarea>
      <button class="send-btn" id="send" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
    <div class="hint"><kbd>Enter</kbd> to send &middot; <kbd>Shift+Enter</kbd> for newline</div>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
